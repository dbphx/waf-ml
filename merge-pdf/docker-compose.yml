services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mergepdf}
      POSTGRES_USER: ${POSTGRES_USER:-mergepdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mergepdf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./scripts/seed_users.sql:/docker-entrypoint-initdb.d/002_seed_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mergepdf} -d ${POSTGRES_DB:-mergepdf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
  backend:
    build:
      context: ./backend
    environment:
      BACKEND_PORT: 8080
      BACKEND_PUBLIC_URL: http://localhost:8080
      ALLOWED_ORIGIN: http://localhost:4173
      DATABASE_URL: postgres://${POSTGRES_USER:-mergepdf}:${POSTGRES_PASSWORD:-mergepdf}@postgres:5432/${POSTGRES_DB:-mergepdf}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-merged-pdfs}
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  postgres_data:
  minio_data:
